name: Push Images to ACR

on:
  push:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Test
        run: npm test -- --ci

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: regd1.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Backend
        run: |
          docker build ./backend -t regd1.azurecr.io/my-backend:${{ github.sha }} -t regd1.azurecr.io/my-backend:latest
          docker push regd1.azurecr.io/my-backend --all-tags

      - name: Build and Push Frontend
        run: |
          docker build ./my-app -t regd1.azurecr.io/my-frontend:${{ github.sha }} -t regd1.azurecr.io/my-frontend:latest
          docker push regd1.azurecr.io/my-frontend --all-tags
